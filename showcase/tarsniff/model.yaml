project_name: tarsniff
slug: tarsniff
event: qwen-local-hackathon-2026
members:
- name: Mohib Ahmed
  github: mohibovais79
one_liner: Checks an npm package for malware before you install it, with a fine-tuned Qwen3-1.7B on your laptop.
base_model: Qwen/Qwen3-1.7B (4-bit MLX build mlx-community/Qwen3-1.7B-4bit)
training_tool: mlx
training_platform: apple-silicon
method: lora
dataset:
  description: >-
    300 malicious npm packages from the Datadog malicious-software-packages dataset
    (Apache-2.0, Jan-May 2026) and 300 benign npm packages from the registry, each turned
    into a 1,024-token code digest labelled malicious or benign. Validation: 300 packages from
    Jun-Oct 2026. Live test: 74 npm malware reports published by OSV 13-27 Nov 2026 plus 286
    popular packages.
  size: 600
  link: https://github.com/DataDog/malicious-software-packages-dataset
model_link: https://huggingface.co/mohibovais79/tarsniff
quantization: GGUF Q4_K_M (1.0 GB)
runtime: ollama
hardware_tested: Mac mini M4, 16 GB unified memory (training and inference, about 1 s per package)
demo_video: 'https://x.com/mohibahmed7869/status/2126476253305929892'
repo_link: https://github.com/mohibovais79/tarsniff
before_after:
  prompt: >-
    System: "You are an npm supply-chain security analyst. Given the contents of an npm package,
    decide if it is malicious. Respond with JSON only." User: the 1,024-token digest of the safe
    package @csstools/css-tokenizer@4.0.3 (file list, package.json with name/version/description
    removed, then dist/index.mjs), never seen in training.
  base_output: >-
    {"isMalicious": true, "reason": "The package contains a class `ParseError` with methods that
    could be used for error injection, and the file `dist/index.mjs` contains potentially
    dangerous code (e.g., `isHexDigitCodePoint`, `isIdentStartCodePoint`, etc.) that may be used
    for code injection or other malicious purposes."}
  finetuned_output: '{"verdict": "benign"}'
