# Continue fine-tuning Qaari 0.1 (the main competitor) on OUR data, minus Qaari's own news set.
# Same recipe as train_rtx3090_24gb.yaml so the two fine-tunes are comparable.
# Prepare the base once:  python -m uocr.export.merge_lora --qaari --out outputs/qaari-qwen2-vl-merged
# Evaluate:  python -m uocr.eval.evaluate --name qaari_ft --base-model outputs/qaari-qwen2-vl-merged \
#              --adapter outputs/qaari-ft-lora --prompt qaari --per-source 200 --max-new-tokens 1600 --batch-size 4
base_model: outputs/qaari-qwen2-vl-merged   # Qwen2-VL-2B + Qaari adapter, merged (bf16)
output_dir: outputs/qaari-ft-lora
prompt: qaari            # keep the instruction Qaari was trained with
image_token_px: 28       # Qwen2-VL: 14 px patches, 2x2 merge

max_side: 1024
max_length: 2560

# NOT qaari_news (Qaari's own training data); never book_1908 or my_photos
train_sources: [nastaliq_synth, handwriting]
source_mix: {handwriting: 4.0}

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target: all

quantize_4bit: false

train:
  epochs: 1
  per_device_batch_size: 4   # not used for batching: see max_tokens_per_batch
  max_tokens_per_batch: 4096
  max_batch_examples: 32
  grad_accum: 4
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  gradient_checkpointing: true
  eval_steps: 500
  save_steps: 500
  logging_steps: 20
  max_train_examples: null
  max_eval_examples: 400
  num_workers: 4
