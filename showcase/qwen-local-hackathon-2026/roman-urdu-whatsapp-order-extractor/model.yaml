  size: 110
  link: ''
model_link: 'https://huggingface.co/mabdullahramday56/qwen3-1.7b-roman-urdu-whatsapp-order-gguf'
quantization: 'Q4_K_M'
runtime: 'Ollama 0.40.18'
hardware_tested: 'Windows PC, 20 GB RAM (CPU)'
