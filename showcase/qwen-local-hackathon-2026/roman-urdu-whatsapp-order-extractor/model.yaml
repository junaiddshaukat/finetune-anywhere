project_name: 'Roman Urdu WhatsApp Order Extractor'
slug: 'roman-urdu-whatsapp-order-extractor'
event: 'qwen-local-hackathon-2026'
members:
- name: 'Muhammad Abdullah'
  github: 'Muhammad08-dot'
- name: 'M Taha Tabassum'
  github: 'tahatabassum'
one_liner: 'Fine-tuned Qwen3-1.7B to extract structured JSON orders from messy Roman Urdu WhatsApp messages and run 100% locally via Ollama.'
base_model: 'Qwen/Qwen3-1.7B'
training_tool: 'unsloth'
training_platform: 'colab'
