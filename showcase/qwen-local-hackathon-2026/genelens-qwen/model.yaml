before_after:
  prompt: 'Task: classify a 70 bp human DNA sequence. 1 = core promoter, 0 = not a core promoter.

    Research use only; not a medical diagnosis.

    Sequence: T G T C C T A A T A A G G G A A G C A A G A A G T G T A T T T A T C A C A G A C A T G A A A G C T A A C C G A G G A C T T G A G A G A C T C

    Label:'
  base_output: 'Base Qwen3-4B-Base, no adapter, same prompt. Plain generation: '' 0'' followed by a repeat of the template (''Sequence: T G T C C T A A T A A G G G A A G C A ...''), so it continues a pattern instead of answering. Constrained readout (softmax over tokens 0 and 1): P(1) = 0.407. Its P(1) is 0.35 to 0.41 on every window tried, i.e. no usable signal.'
  finetuned_output: 'GeneLens spaced Q5_K_M GGUF through llama-server: answer ''1'' (core promoter), P(1) = 0.643. The window is the annotated transcription start site of human FOXP2 (GRCh38 chr7:114414781-114414850), checked to share no 24-mer with any GUE train, dev or test window. Same run on a FOXP2 intron window: ''0'', P(1) = 0.076 (correct). Same run on the SOX2 promoter window: ''0'', P(1) = 0.267 (WRONG, a miss). Three windows are an illustration only; the evidence is the 5,920-window test split (MCC 0.711 over 3 seeds vs 0.092 zero-shot).'
