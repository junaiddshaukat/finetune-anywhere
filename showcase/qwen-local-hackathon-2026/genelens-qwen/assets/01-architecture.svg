<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="748" viewBox="0 0 1200 748" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-label="GeneLens desktop architecture: sandboxed renderer, typed IPC bridge, Electron main process, local llama-server on 127.0.0.1, no outbound network"><title>GeneLens desktop architecture: sandboxed renderer, typed IPC bridge, Electron main process, local llama-server on 127.0.0.1, no outbound network</title><defs><marker id="as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1200" height="748" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.5"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start">Desktop app architecture</text><text x="40" y="74" font-size="15" fill="#475569" text-anchor="start">Everything runs on your computer. The only network path is loopback to the local engine.</text><rect x="24" y="96" width="1152" height="480" rx="16" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="9 6"/><text x="44" y="122" font-size="14" font-weight="700" fill="#059669" text-anchor="start">YOUR COMPUTER</text><rect x="44" y="140" width="220" height="352" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="60" y="170" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Renderer</text><text x="60" y="200" font-size="15" fill="#475569" text-anchor="start">React 19 interface</text><text x="60" y="222" font-size="15" fill="#475569" text-anchor="start">Sandboxed, no Node</text><text x="60" y="244" font-size="15" fill="#475569" text-anchor="start">Context isolation on</text><text x="60" y="266" font-size="15" fill="#475569" text-anchor="start">CSP: connect-src &#x27;none&#x27;</text><text x="60" y="288" font-size="15" fill="#475569" text-anchor="start"></text><text x="60" y="310" font-size="15" fill="#475569" text-anchor="start">Views: Analyze, Batch,</text><text x="60" y="332" font-size="15" fill="#475569" text-anchor="start">Scan, Learn, Models,</text><text x="60" y="354" font-size="15" fill="#475569" text-anchor="start">Benchmarks</text><rect x="324" y="140" width="190" height="352" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="340" y="170" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Preload bridge</text><text x="340" y="200" font-size="15" fill="#475569" text-anchor="start">Typed IPC</text><text x="340" y="222" font-size="15" fill="#475569" text-anchor="start">31 methods</text><text x="340" y="244" font-size="15" fill="#475569" text-anchor="start"></text><text x="340" y="266" font-size="15" fill="#475569" text-anchor="start">The only calls that</text><text x="340" y="288" font-size="15" fill="#475569" text-anchor="start">cross the sandbox</text><rect x="574" y="140" width="290" height="352" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/><text x="590" y="168" font-size="16" font-weight="700" fill="#064E3B" text-anchor="start">Electron main process</text><rect x="590" y="184" width="258" height="96" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="606" y="214" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Model manager</text><text x="606" y="244" font-size="15" fill="#475569" text-anchor="start">SHA-256 + manifest check</text><text x="606" y="266" font-size="15" fill="#475569" text-anchor="start">Unknown formats refused</text><rect x="590" y="284" width="258" height="96" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="606" y="314" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Scan engine</text><text x="606" y="344" font-size="15" fill="#475569" text-anchor="start">70 bp tiling, N handling</text><text x="606" y="366" font-size="15" fill="#475569" text-anchor="start">Cancel and resume</text><rect x="590" y="384" width="258" height="96" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="606" y="414" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Learning loop</text><text x="606" y="444" font-size="15" fill="#475569" text-anchor="start">Written in TypeScript</text><text x="606" y="466" font-size="15" fill="#475569" text-anchor="start">Calibration, head, memory</text><rect x="954" y="140" width="202" height="152" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><text x="970" y="170" font-size="16" font-weight="700" fill="#064E3B" text-anchor="start">Engine sidecar</text><text x="970" y="200" font-size="15" fill="#0F172A" text-anchor="start">llama-server, CPU</text><text x="970" y="222" font-size="15" fill="#0F172A" text-anchor="start">Binds 127.0.0.1 only</text><text x="970" y="244" font-size="15" fill="#0F172A" text-anchor="start">API key required</text><text x="970" y="266" font-size="15" fill="#0F172A" text-anchor="start">No web UI</text><rect x="954" y="396" width="202" height="96" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><text x="970" y="426" font-size="16" font-weight="700" fill="#064E3B" text-anchor="start">Model on disk</text><text x="970" y="456" font-size="15" fill="#0F172A" text-anchor="start">GGUF Q5_K_M</text><text x="970" y="478" font-size="15" fill="#0F172A" text-anchor="start">+ manifest file</text><path d="M264 316 L322 316" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><text x="293" y="304" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">IPC</text><path d="M514 316 L572 316" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><text x="543" y="304" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">calls</text><path d="M864 232 L952 232" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><text x="908" y="218" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">loopback</text><text x="908" y="256" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">HTTP</text><path d="M1055 292 L1055 394" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><text x="1066" y="350" font-size="14" font-weight="700" fill="#475569" text-anchor="start">loads</text><rect x="44" y="516" width="1112" height="44" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><text x="600" y="545" font-size="16" font-weight="700" fill="#064E3B" text-anchor="middle">No outbound network: only loopback to the local engine is allowed</text><line x1="600" y1="576" x2="600" y2="648" stroke="#475569" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="600" cy="612" r="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.4"/><path d="M592.5 604.5 L607.5 619.5 M607.5 604.5 L592.5 619.5" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/><text x="628" y="618" font-size="15" fill="#475569" text-anchor="start">Blocked: non-loopback requests are denied</text><rect x="420" y="648" width="360" height="76" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600" y="678" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Internet, cloud APIs, telemetry</text><text x="600" y="704" font-size="15" fill="#475569" text-anchor="middle">Never contacted by the app</text></svg>
