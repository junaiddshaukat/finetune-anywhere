<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="system-ui, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Training and evaluation pipeline from GUE prom_core_all to the app, with measured MCC: zero-shot 0.092, raw 0.675, spaced 0.711"><title>Training and evaluation pipeline from GUE prom_core_all to the app, with measured MCC: zero-shot 0.092, raw 0.675, spaced 0.711</title><defs><marker id="as" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1200" height="740" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1.5"/><text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start">Training and evaluation pipeline</text><text x="40" y="74" font-size="15" fill="#475569" text-anchor="start">Every number is measured and comes from a file under benchmarks/reports.</text><rect x="40" y="104" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="56" y="134" font-size="16" font-weight="700" fill="#059669" text-anchor="start">1. Data</text><text x="56" y="164" font-size="15" fill="#475569" text-anchor="start">GUE prom_core_all</text><text x="56" y="186" font-size="15" fill="#475569" text-anchor="start">70 bp human windows</text><text x="56" y="208" font-size="15" fill="#475569" text-anchor="start">Balanced, 50% promoters</text><rect x="330" y="104" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="346" y="134" font-size="16" font-weight="700" fill="#059669" text-anchor="start">2. Leakage cleanup</text><text x="346" y="164" font-size="15" fill="#475569" text-anchor="start">Drop exact overlaps with</text><text x="346" y="186" font-size="15" fill="#475569" text-anchor="start">dev and test</text><text x="346" y="208" font-size="15" fill="#475569" text-anchor="start">47,072 train windows left</text><rect x="620" y="104" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="636" y="134" font-size="16" font-weight="700" fill="#059669" text-anchor="start">3. Fine-tune</text><text x="636" y="164" font-size="15" fill="#475569" text-anchor="start">Unsloth bf16 LoRA, r=32</text><text x="636" y="186" font-size="15" fill="#475569" text-anchor="start">Qwen3-4B-Base</text><text x="636" y="208" font-size="15" fill="#475569" text-anchor="start">Colab L4 or A100</text><text x="636" y="230" font-size="15" fill="#475569" text-anchor="start">2 epochs, 2,942 steps</text><rect x="910" y="104" width="250" height="150" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><text x="926" y="134" font-size="16" font-weight="700" fill="#064E3B" text-anchor="start">4. Input format</text><text x="926" y="164" font-size="15" fill="#0F172A" text-anchor="start">Pre-registered choice:</text><text x="926" y="186" font-size="15" fill="#0F172A" text-anchor="start">raw string vs spaced</text><text x="926" y="208" font-size="15" fill="#0F172A" text-anchor="start">(one token per base)</text><text x="926" y="230" font-size="15" fill="#0F172A" text-anchor="start">Rule fixed before any run</text><path d="M292 179 L328 179" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><path d="M582 179 L618 179" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><path d="M872 179 L908 179" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><path d="M1035 254 L1035 277 L165 277 L165 298" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><rect x="40" y="300" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="56" y="330" font-size="16" font-weight="700" fill="#059669" text-anchor="start">5. Frozen test split</text><text x="56" y="360" font-size="15" fill="#475569" text-anchor="start">5,920 windows</text><text x="56" y="382" font-size="15" fill="#475569" text-anchor="start">Scored once per model</text><text x="56" y="404" font-size="15" fill="#475569" text-anchor="start">Never used to tune</text><rect x="330" y="300" width="250" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/><text x="346" y="330" font-size="16" font-weight="700" fill="#059669" text-anchor="start">6. Export</text><text x="346" y="360" font-size="15" fill="#475569" text-anchor="start">Merged GGUF Q5_K_M</text><text x="346" y="382" font-size="15" fill="#475569" text-anchor="start">2.89 GB</text><text x="346" y="404" font-size="15" fill="#475569" text-anchor="start">Parity with full model:</text><text x="346" y="426" font-size="15" fill="#475569" text-anchor="start">98.67% agreement</text><rect x="620" y="300" width="250" height="150" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/><text x="636" y="330" font-size="16" font-weight="700" fill="#064E3B" text-anchor="start">7. GeneLens app</text><text x="636" y="360" font-size="15" fill="#0F172A" text-anchor="start">Offline desktop app</text><text x="636" y="382" font-size="15" fill="#0F172A" text-anchor="start">Manifest picks the</text><text x="636" y="404" font-size="15" fill="#0F172A" text-anchor="start">input format</text><text x="636" y="426" font-size="15" fill="#0F172A" text-anchor="start">Windows installer</text><rect x="910" y="300" width="250" height="150" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/><text x="926" y="330" font-size="16" font-weight="700" fill="#B45309" text-anchor="start">Read before relying</text><text x="926" y="360" font-size="15" fill="#7C2D12" text-anchor="start">In-distribution test:</text><text x="926" y="382" font-size="15" fill="#7C2D12" text-anchor="start">28% of test windows share</text><text x="926" y="404" font-size="15" fill="#7C2D12" text-anchor="start">a 24-mer with train.</text><text x="926" y="426" font-size="15" fill="#7C2D12" text-anchor="start">Scores are uncalibrated.</text><path d="M292 375 L328 375" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><path d="M582 375 L618 375" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ag)"/><rect x="40" y="478" width="1120" height="236" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/><text x="60" y="508" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Test MCC on the frozen split (5,920 windows, each model scored once)</text><rect x="724.0" y="534" width="54.0" height="150" rx="0" fill="#E2E8F0" stroke="none" stroke-width="1.5"/><line x1="340.0" y1="534" x2="340.0" y2="686" stroke="#CBD5E1" stroke-width="1.5"/><text x="340.0" y="704" font-size="14" fill="#475569" text-anchor="middle">0</text><line x1="940.0" y1="534" x2="940.0" y2="686" stroke="#CBD5E1" stroke-width="1.5"/><text x="940.0" y="704" font-size="14" fill="#475569" text-anchor="middle">1.0</text><text x="60" y="569" font-size="15" fill="#0F172A" text-anchor="start">Qwen3-4B-Base, zero-shot</text><rect x="340" y="548" width="55.199999999999996" height="30" rx="6" fill="#94A3B8" stroke="none" stroke-width="1.5"/><text x="405.2" y="569" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">0.092</text><text x="60" y="619" font-size="15" fill="#0F172A" text-anchor="start">LoRA, raw input, 3 seeds</text><rect x="340" y="598" width="405.0" height="30" rx="6" fill="#10B981" stroke="none" stroke-width="1.5"/><text x="755.0" y="619" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">0.675</text><text x="60" y="669" font-size="15" fill="#0F172A" text-anchor="start">LoRA, spaced input, 3 seeds</text><rect x="340" y="648" width="426.59999999999997" height="30" rx="6" fill="#059669" stroke="none" stroke-width="1.5"/><text x="776.5999999999999" y="669" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">0.711</text><text x="960" y="560" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Shaded band:</text><text x="960" y="582" font-size="14" fill="#475569" text-anchor="start">published specialist</text><text x="960" y="602" font-size="14" fill="#475569" text-anchor="start">models, about</text><text x="960" y="622" font-size="14" fill="#475569" text-anchor="start">0.64 to 0.73</text></svg>
