hardware_tested: NVIDIA L4 (Google Colab; 2.0 GB peak inference VRAM, 2.5 GB peak training VRAM)
demo_video: https://www.linkedin.com/posts/abdullahkhansherwani_qwenlocalhackathon-ugcPost-7532386077832110080-cOav/
repo_link: ''
before_after:
  prompt: |-
    Held-out WDC Products unseen test pair (wdc_f5e3826378a43ee0):
    offer_a: {"title": "Mf Las B/N A4 Lan F/R 40Ppm Brother Dcpl5500Dn", "description": null, "brand": null}
    offer_b: {"title": "Brother DCP-L5500DN multifunctional Laser 1200 x 1200 DPI 40 ppm A4", "description": "Brother DCP-L5500DN, Laser, Mono printing, 1200 x 1200 DPI, A4, Direct printing, Black, Graphite", "brand": null}
    Question: Do the two product offers describe the same real-world product (same make, model and variant)? Answer MATCH if they are the same product, DIFFERENT if they are not.
    Options: A = MATCH (Both offers describe the same product.), B = DIFFERENT (The offers describe different products, variants or models.)
  base_output: 'DIFFERENT (T=1.0 softmax P(MATCH)=0.0550; raw restricted logits MATCH=24.4844, DIFFERENT=27.3281; below both validation max-F1 threshold 0.1441 and 1% FPR threshold 0.2659; gold label: MATCH)'
  finetuned_output: 'MATCH (T=1.0 softmax P(MATCH)=0.9981; raw restricted logits MATCH=22.2969, DIFFERENT=16.0469; clears both validation max-F1 threshold 0.8222 and 1% FPR threshold 0.9927; gold label: MATCH)'
