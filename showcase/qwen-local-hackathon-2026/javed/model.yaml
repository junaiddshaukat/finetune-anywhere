dataset:
  description: WDC Products 80% corner-case medium benchmark (6,000 train, 3,500 validation, 4,500 unseen test pairs; title, brand, and 100-word-capped description; no price or currency)
  size: 6000
  link: https://github.com/wbsg-uni-mannheim/MatchGPT/tree/ba1691935c744bb0eacc9abf772f39271e318e4b/LLMForEM/data/wdc
model_link: https://huggingface.co/AbdullahKhanSherwani/Javed
