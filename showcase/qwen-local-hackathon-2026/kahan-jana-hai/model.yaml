# Submission form — Qwen Local Hackathon 2026.
# Every value below is measured; see README.md for the evidence behind each one.
project_name: 'Kahan Jana Hai — Karachi bus query parser'
slug: 'kahan-jana-hai'
event: 'qwen-local-hackathon-2026'
members:
- name: 'Muhammad Waqar'
  github: 'Muhammad-waqar-uit'
one_liner: 'A 0.5B Qwen extracts Karachi bus stops from messy Roman Urdu, English, or Urdu queries for offline route planning.'
base_model: 'Qwen/Qwen2.5-0.5B-Instruct'
training_tool: 'trl'
training_platform: 'local-nvidia'
