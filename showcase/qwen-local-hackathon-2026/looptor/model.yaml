runtime: 'Ollama (100% local, works offline)'
hardware_tested: 'Ollama on CPU: AMD EPYC shared cloud VM, ~1.5 vCPU, 7 GB RAM (GGUF Q4_K_M, ~4 tok/s); trained on free Kaggle T4 GPU'
