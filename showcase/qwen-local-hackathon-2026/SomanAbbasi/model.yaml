before_after:
  prompt: "Yaar, mera food abhi tak deliver nahi hua. App pe showing delivered hai but mujhe mila hi nahi. Please check karo."
  base_output: |
    Yaar, main kisi bhi order ke record ko dekha nahi sakta, lekin agar aapne order number ya delivery time diya hai toh main uska status check karne ke liye help kar sakta hoon. Lekin main kisi bhi order ko cancel ya update nahi kar sakta. Aapne order number ya delivery time bataiye toh main aapko confirm karne ke liye help kar sakta hoon. 😊
  finetuned_output: |
    Sorry ke liye kitchen aur delivery status check karna main nahi kar sakta. Apna order number share kar dein taake hum verify kar saken.
